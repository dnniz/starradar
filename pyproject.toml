[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starradar"
version = "0.1.0"
description = "Radar de repos de GitHub nuevos con estrellas en crecimiento real, con score de autenticidad explicable, CLI, MCP server y dashboard web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dnniz" }]
keywords = ["github", "trending", "mcp", "agents", "open-source"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

# Dependencias deliberadamente mínimas: el core (scoring, store, digest,
# atlas) funciona con la stdlib. httpx sólo para HTTP y mcp sólo para el
# servidor MCP, para que se puedan instalar de forma independiente.
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
rich = ["rich>=13.7"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
starradar = "starradar.cli:main"

[project.urls]
Homepage = "https://github.com/dnniz/starradar"
Repository = "https://github.com/dnniz/starradar"
Issues = "https://github.com/dnniz/starradar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/starradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "live: requiere red y un token real de GitHub (se salta sin STARRADAR_LIVE=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",   # el largo lo gestiona el formatter
    "B008",   # DeprecationWarning en defaults de argparse: es idiomático
    "SIM108", # el ternario no siempre es más legible
    "SIM102", # el `if` anidado con `continue` se lee mejor que un `and`
    "C408",   # las factories de test usan dict() para poder sobrescribir con **kw
]

[tool.ruff.lint.per-file-ignores]
# Los tests declaran factories con dict()+**kw justamente para poder
# sobrescribir campos; reescribirlas como literal las haría menos útiles.
"tests/*" = ["C408"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
